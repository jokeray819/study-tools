<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>几何变换演示 · 数学教学工具</title>
<style>
:root{font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#242d27;background:#f2f3f2;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}header{height:62px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;background:white;border-bottom:1px solid #dedfdf}h1{font-size:19px;margin:0;letter-spacing:1px}.brand{display:flex;align-items:center;gap:11px}.logo{font-size:27px;color:#45a34f}.subtitle{font-size:12px;color:#88928b;margin-top:3px}.badge{font-size:12px;color:#65816b;background:#eef6ef;padding:7px 12px;border-radius:5px}main{display:flex;height:calc(100dvh - 62px)}aside{width:290px;flex-shrink:0;padding:14px;overflow:auto;border-right:1px solid #d9dfda;background:#f2f3f2}.panel{background:white;padding:16px;margin-bottom:13px;border:1px solid #e7eae7;box-shadow:0 2px 2px #00000006}h2{font-size:15px;margin:0 0 17px}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stack{display:grid;gap:8px}button{background:#4caf50;color:white;border:1px solid #449f49;border-radius:3px;min-height:31px;padding:6px 8px;font-size:12px;transition:background .15s}button:hover{background:#3e9843}button.active{background:#2d7e34;box-shadow:inset 0 0 0 1px #256f2b}button:focus-visible,input:focus-visible{outline:3px solid #85b9ec;outline-offset:2px}.hint{font-size:12px;line-height:1.7;color:#808780;margin:11px 0 0}.field{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px}.field label{min-width:65px}input[type=number]{min-width:0;width:100%;height:29px;border:1px solid #daddda;border-radius:2px;padding:3px 8px}input[type=range]{min-width:0;flex:1;accent-color:#328ccd}.danger{background:#ed5951;border-color:#da4943}.danger:hover{background:#d84a43}.range{display:flex;align-items:center;gap:8px;margin:13px 0;font-size:12px}.range output{width:38px;text-align:right}.board{position:relative;flex:1;min-width:0;background:#fff;overflow:hidden}svg{display:block;width:100%;height:100%;touch-action:none}.board-label{position:absolute;left:23px;top:19px;font-size:12px;letter-spacing:1px;color:#9aa59c;pointer-events:none}.status{position:absolute;bottom:18px;left:22px;right:22px;display:flex;justify-content:space-between;gap:12px;pointer-events:none;font-size:12px;color:#738079}.status span{padding:8px 12px;background:#ffffffed;border:1px solid #e7ebe7;border-radius:4px}.original{fill:#51a9e828;stroke:#318dae;stroke-width:2}.result{fill:#ffb34d33;stroke:#e39a35;stroke-width:2}.vertex{fill:#49a8d3;stroke:#237b9b;stroke-width:1}.guide{stroke:#dc6565;stroke-width:1.5;stroke-dasharray:6 5}.legend{display:flex;align-items:center;gap:7px}.dot{width:8px;height:8px;background:#399dce;border-radius:50%;display:inline-block}.dot.orange{background:#e5a145;margin-left:10px}@media(max-width:640px){header{padding:0 14px}.badge{display:none}aside{width:230px;padding:9px}.panel{padding:12px}.board-label{left:12px}.status{left:10px;right:10px;flex-direction:column;align-items:flex-start}.status span{padding:6px;font-size:11px}h1{font-size:16px}}
</style>
</head>
<body>
<header><div class="brand"><span class="logo">△</span><div><h1>几何变换演示</h1><div class="subtitle">观察图形 · 探索变换 · 发现规律</div></div></div><span class="badge">数学教学工具</span></header>
<main>
<aside aria-label="几何变换工具">
<section class="panel"><h2>形状选择</h2><div class="buttons"><button data-shape="3" class="active">三角形</button><button data-shape="4">矩形</button><button data-shape="5">五边形</button><button data-shape="6">六边形</button><button id="draw">自由绘制</button><button id="clear">清空画布</button></div><p class="hint">点击选择要绘制的形状，或使用自由绘制工具逐点绘制，点击起点闭合。</p></section>
<section class="panel"><h2>平移变换</h2><div class="field"><label for="tx">X平移(格):</label><input id="tx" type="number" value="0" step="1"></div><div class="field"><label for="ty">Y平移(格):</label><input id="ty" type="number" value="0" step="1"></div><div class="pair"><button id="translate">应用平移</button><button id="resetTranslate">重置平移</button></div><p class="hint">输入平移格数后点击应用。<br>正数向右 / 下，负数向左 / 上。</p></section>
<section class="panel"><h2>对称变换</h2><div class="stack"><button id="center">设置对称中心点</button><button id="axis">设置对称轴线</button><div class="pair"><button id="reflect">应用对称</button><button id="resetReflect">重置对称</button></div></div><p class="hint">先选择对称类型，在画布上设置中心点或轴线，然后点击应用。</p></section>
<section class="panel"><h2>旋转变换</h2><button id="pivot" class="danger" style="width:100%">设置旋转中心点</button><div class="range"><label for="angle">旋转角度:</label><input id="angle" type="range" min="-180" max="180" value="0"><output id="degrees" for="angle">0°</output></div><div class="pair"><button id="rotate">应用旋转</button><button id="resetRotate">重置旋转</button></div><p class="hint">设置中心后调整角度。<br>正角度顺时针，负角度逆时针。</p></section>
</aside>
<div class="board"><div class="board-label">几何实验画布 / 每小格 1 单位</div><svg id="canvas" xmlns="http://www.w3.org/2000/svg" aria-label="几何图形网格画布"><defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e3e7e4" stroke-width="1"/></pattern><pattern id="major" width="100" height="100" patternUnits="userSpaceOnUse"><rect width="100" height="100" fill="url(#grid)"/><path d="M100 0H0V100" fill="none" stroke="#cdd4cf" stroke-width="1"/></pattern></defs><rect width="100%" height="100%" fill="url(#major)"/><g id="geometry"></g><g id="guides"></g></svg><div class="status"><span id="message" role="status">已选择三角形，试着做一次平移吧</span><span class="legend"><i class="dot"></i>原图形<i class="dot orange"></i>变换后</span></div></div>
</main>
<script>
const $=id=>document.getElementById(id);
const svg=$('canvas'), geometry=$('geometry'), guides=$('guides');
let points=[], transformed=[], mode='', symmetry='', center=null, axis=[], pivot=null;
const tell=text=>$('message').textContent=text;
function element(tag,attributes,parent){const node=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [key,value] of Object.entries(attributes))node.setAttribute(key,value);parent.appendChild(node);return node;}
function render(){geometry.replaceChildren();if(points.length){element(mode==='draw'?'polyline':'polygon',{points:points.map(p=>p.join(',')).join(' '),class:'original'},geometry);points.forEach(([cx,cy])=>element('circle',{cx,cy,r:4,class:'vertex'},geometry));}if(transformed.length)element('polygon',{points:transformed.map(p=>p.join(',')).join(' '),class:'result'},geometry);}
function mark(p,label){element('circle',{cx:p[0],cy:p[1],r:5,fill:'#e56760'},guides);const t=element('text',{x:p[0]+10,y:p[1]-10,fill:'#be514c','font-size':13},guides);t.textContent=label;}
function renderGuides(){guides.replaceChildren();if(center)mark(center,'对称中心');if(pivot)mark(pivot,'旋转中心');if(axis.length===1)mark(axis[0],'轴线起点');if(axis.length===2){const [a,b]=axis,dx=b[0]-a[0],dy=b[1]-a[1];element('line',{x1:a[0]-dx*100,y1:a[1]-dy*100,x2:a[0]+dx*100,y2:a[1]+dy*100,class:'guide'},guides);}}
function choose(n){mode='';center=null;axis=[];pivot=null;symmetry='';transformed=[];const x=Math.round(svg.clientWidth/40)*20,y=Math.round(svg.clientHeight/40)*20;points=n===3?[[x,y-60],[x-60,y+60],[x+60,y+60]]:n===4?[[x-80,y-60],[x+80,y-60],[x+80,y+60],[x-80,y+60]]:Array.from({length:n},(_,i)=>[x+80*Math.cos(-Math.PI/2+i*2*Math.PI/n),y+80*Math.sin(-Math.PI/2+i*2*Math.PI/n)]);document.querySelectorAll('[data-shape]').forEach(b=>b.classList.toggle('active',Number(b.dataset.shape)===n));$('draw').classList.remove('active');render();renderGuides();tell('图形已就绪，选择左侧工具开始变换');}
function ready(){if(points.length<3||mode==='draw'){tell('请先选择图形，或完成自由绘制');return false;}return true;}
document.querySelectorAll('[data-shape]').forEach(b=>b.onclick=()=>choose(Number(b.dataset.shape)));
$('clear').onclick=()=>{points=[];transformed=[];center=null;axis=[];pivot=null;mode='';symmetry='';document.querySelectorAll('button.active').forEach(b=>b.classList.remove('active'));render();renderGuides();tell('画布已清空，请选择或绘制图形');};
$('draw').onclick=()=>{$('clear').click();mode='draw';$('draw').classList.add('active');tell('点击网格添加顶点，至少三个点后点击起点闭合');};
$('translate').onclick=()=>{if(!ready())return;const x=Number($('tx').value),y=Number($('ty').value);if(!Number.isFinite(x)||!Number.isFinite(y)){tell('请输入有效的平移格数');return;}transformed=points.map(p=>[p[0]+20*x,p[1]+20*y]);render();tell(`平移：X ${x} 格，Y ${y} 格`);};
$('resetTranslate').onclick=()=>{$('tx').value=0;$('ty').value=0;transformed=[];render();tell('已重置平移');};
for(const id of ['center','axis','pivot'])$(id).onclick=()=>{if(!ready())return;mode=id;if(id==='axis'){axis=[];center=null;symmetry='axis';}if(id==='center'){center=null;axis=[];symmetry='center';}if(id==='pivot')pivot=null;renderGuides();tell(id==='axis'?'在画布上点击两个不同的点，确定对称轴':'在画布上点击，设置'+(id==='pivot'?'旋转中心':'对称中心'));};
svg.addEventListener('pointerdown',event=>{const rect=svg.getBoundingClientRect(),p=[Math.round((event.clientX-rect.left)/20)*20,Math.round((event.clientY-rect.top)/20)*20];if(mode==='draw'){if(points.length>=3&&Math.hypot(p[0]-points[0][0],p[1]-points[0][1])<12){mode='';$('draw').classList.remove('active');tell('自由图形已完成，可以开始变换');}else if(!points.some(q=>q[0]===p[0]&&q[1]===p[1]))points.push(p);render();}else if(mode==='center'||mode==='pivot'){if(mode==='center')center=p;else pivot=p;mode='';renderGuides();tell('中心点已设置，点击应用进行变换');}else if(mode==='axis'){if(axis.length&&p[0]===axis[0][0]&&p[1]===axis[0][1])return;axis.push(p);if(axis.length===2){mode='';tell('对称轴已设置，点击应用对称');}renderGuides();}});
$('reflect').onclick=()=>{if(!ready())return;if(symmetry==='center'&&center){transformed=points.map(p=>[2*center[0]-p[0],2*center[1]-p[1]]);}else if(symmetry==='axis'&&axis.length===2){const [a,b]=axis,dx=b[0]-a[0],dy=b[1]-a[1];/* 将顶点投影到轴线上，再取关于投影点的对称位置。 */transformed=points.map(p=>{const t=((p[0]-a[0])*dx+(p[1]-a[1])*dy)/(dx*dx+dy*dy);return [2*(a[0]+t*dx)-p[0],2*(a[1]+t*dy)-p[1]];});}else{tell('请先设置对称中心或完整的对称轴');return;}render();tell(symmetry==='center'?'已完成中心对称':'已完成轴对称');};
$('resetReflect').onclick=()=>{center=null;axis=[];symmetry='';if(mode==='center'||mode==='axis')mode='';transformed=[];render();renderGuides();tell('已重置对称');};
$('angle').oninput=()=>{$('degrees').value=$('angle').value+'°';};
$('rotate').onclick=()=>{if(!ready())return;if(!pivot){tell('请先设置旋转中心点');return;}const a=Number($('angle').value)*Math.PI/180;transformed=points.map(p=>{const x=p[0]-pivot[0],y=p[1]-pivot[1];return [pivot[0]+x*Math.cos(a)-y*Math.sin(a),pivot[1]+x*Math.sin(a)+y*Math.cos(a)];});render();tell(`已绕旋转中心旋转 ${$('angle').value}°`);};
$('resetRotate').onclick=()=>{pivot=null;if(mode==='pivot')mode='';$('angle').value=0;$('degrees').value='0°';transformed=[];render();renderGuides();tell('已重置旋转');};
choose(3);
</script>
</body>
</html>
