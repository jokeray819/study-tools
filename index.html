<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="数学学习小工具：探索平面几何变换、三角形内角和与立体空间堆叠。">
  <title>数学探索 · 学习小工具</title>
  <style>
    :root { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; color: #24324a; background: #f7f9ff; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 12% 15%, #fff2d7, transparent 35%), radial-gradient(circle at 90% 85%, #ddf5ef, transparent 35%); }
    main { width: min(920px, calc(100% - 40px)); margin: 0 auto; padding: 100px 0 60px; }
    .eyebrow { color: #5262d4; font-size: 13px; font-weight: 700; letter-spacing: 3px; }
    h1 { margin: 18px 0; font-size: clamp(32px, 6vw, 52px); letter-spacing: -1px; }
    .intro { margin: 0; color: #65738a; line-height: 1.8; }
    nav { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; margin-top: 44px; }
    .card { display: flex; flex-direction: column; align-items: flex-start; padding: 32px; border: 1px solid #dfe5ef; border-radius: 24px; background: #ffffffdb; color: inherit; text-decoration: none; transition: transform .18s, box-shadow .18s; }
    .card:hover { transform: translateY(-4px); box-shadow: 0 14px 32px #24324a10; }
    .card:focus-visible { outline: 3px solid #5262d4; outline-offset: 5px; }
    .icon { display: grid; place-items: center; width: 64px; height: 64px; border-radius: 18px; background: #e9f5ed; color: #35844c; font-size: 38px; }
    .space .icon { color: #5262d4; background: #edf0ff; }
    .angle .icon { color: #d9752b; background: #fff0dc; }
    h2 { margin: 24px 0 12px; font-size: 24px; }
    .description { margin: 0 0 28px; color: #65738a; line-height: 1.8; }
    .enter { margin-top: auto; color: #35844c; font-weight: 700; }
    .space .enter { color: #5262d4; }
    .angle .enter { color: #d9752b; }
    footer { margin-top: 36px; color: #65738a; font-size: 13px; }
    @media (max-width: 860px) { nav { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 600px) { main { padding-top: 52px; } nav { grid-template-columns: 1fr; gap: 18px; margin-top: 32px; } .card { padding: 26px; } }
    @media (prefers-reduced-motion: reduce) { .card { transition: none; } .card:hover { transform: none; } }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">数学探索 / 学习小工具</p>
      <h1>动手试一试，数学更有趣</h1>
      <p class="intro">从平面图形到立体空间，选择一个工具，开始今天的探索。</p>
    </header>
    <nav aria-label="学习工具">
      <a class="card" href="./draw-view/index.html">
        <span class="icon" aria-hidden="true">△</span>
        <h2>几何变换演示</h2>
        <p class="description">绘制平面图形，尝试平移、对称与旋转，观察图形变换中的规律。</p>
        <span class="enter">开始探索 <span aria-hidden="true">→</span></span>
      </a>
      <a class="card space" href="./3dview/index.html">
        <span class="icon" aria-hidden="true">▧</span>
        <h2>空间堆叠教具</h2>
        <p class="description">动手堆叠立方体，从不同视角观察立体结构，培养空间想象力。</p>
        <span class="enter">开始搭建 <span aria-hidden="true">→</span></span>
      </a>
      <a class="card angle" href="./triangle-sum/index.html">
        <span class="icon" aria-hidden="true">∠</span>
        <h2>三角形内角和</h2>
        <p class="description">拖动三个顶点改变三角形，观察三个内角如何变化，以及它们为什么总和为 180°。</p>
        <span class="enter">开始探索 <span aria-hidden="true">→</span></span>
      </a>
    </nav>
    <footer>观察 · 操作 · 发现</footer>
  </main>
</body>
</html>
